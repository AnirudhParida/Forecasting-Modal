# Netraa POC configuration.
#
# Scope (approved): one SERVICE hosted on one HOST.
# Horizon (approved): next quarter.

base_url: https://nlq64817.live.dynatrace.com
registry: metrics_registry.yaml
data_dir: data
artifacts_dir: artifacts

scope:
  # Overridden by NETRAA_HOST_ID / NETRAA_SERVICE_ID if set in .env.
  host_id: HOST-D9739223FC540A23
  service_id: SERVICE-C16E984A4D0792A9

# ---------------------------------------------------------------------------
# Two grids. A quarter-ahead forecast on a 1-minute grid would be 129,600 steps
# ahead, which is not a forecast. So the fine grid serves dependency discovery
# (where minute-scale lags live) and the coarse grid serves the forecaster.
#
# `netraa probe` measures what the tenant actually retains and rewrites the
# lookback_days values below to what is genuinely available.
# ---------------------------------------------------------------------------
grids:
  fine:
    resolution: 1m
    pandas_freq: 1min
    lookback_days: 7
    purpose: dependency_map

  coarse:
    resolution: 1d
    pandas_freq: 1D
    lookback_days: 400
    purpose: forecast

# Drop a node from the panel if fewer than this fraction of its buckets were
# ever observed. Dropped nodes are logged by name, never removed silently.
min_coverage: 0.40   # raised from 0.20; drops nodes with >60% gaps on the coarse grid

# A node below min_coverage is still kept when it is short-history rather than
# gappy: coverage since its first observation >= min_tail_coverage, with at
# least min_observed_steps observed buckets. The mask channel carries the
# missing early span. This is what keeps the per-disk / per-PGI JVM metrics
# (onboarded ~154 days into the 400-day span) in the panel and in the graph.
min_tail_coverage: 0.60
min_observed_steps: 90

# Seasonal period in steps, per grid — used by the seasonal_naive baseline.
# 7 daily steps = one week; 288 five-minute steps = one day.
season_steps:
  coarse: 7
  fine: 1440  # 1440 x 1min = one day

forecast:
  grid: coarse
  input_steps: 56        # was 90 — 8 weeks of context. With only ~400 daily
                         # steps, every input day traded away buys extra
                         # training windows (221 -> 255) and reduces overlap
                         # between them; the TCN's receptive field needs far
                         # less than 90 anyway.
  horizons: [7, 30, 60, 90]
  quantiles: [0.1, 0.5, 0.9]

graph:
  grid: coarse          # lags discovered on the daily grid (used as forecaster prior)
  max_lag_steps: 14     # 14 x 1d = 2 weeks of lag search
  xcorr_threshold: 0.30
  granger_alpha: 0.05
  mi_threshold: 0.05
  top_k: 8               # max incoming edges retained per node
  min_overlap: 60        # min overlapping non-null samples to score a pair

model:
  hidden: 32            # back from 64 — the 400-step backtest peaked at val
                        # epoch 3-6 then overfitted monotonically; the capacity
                        # increase solved a problem the data does not have
  blocks: 2             # back from 3, same evidence
  kernel_size: 3
  dropout: 0.3          # was 0.2 — tiny, heavily overlapping window set
  node_embed_dim: 16
  graph_prior_weight: 0.5    # was 0.1 — stronger prior pull → higher precision vs statistical map
  graph_sparsity_weight: 0.01
  lr: 5.0e-4
  weight_decay: 0.001   # was 1e-4 — see dropout note
  epochs: 200
  batch_size: 16
  patience: 15          # was 40 — best val arrives by epoch ~6; 40 stale epochs
                        # after the peak is pure wasted compute
  input_noise: 0.1      # gaussian jitter on the value channel during training
  seed: 42
